    <p>烏龜不知道兔子正在睡覺，牠只專心地看著前方，持續一步一步地往終點前進。</p>
    <p>雖然速度不快，但烏龜從未放棄。當兔子醒來時，才發現烏龜已經快要到達終點。</p>
