    <img class="story-image"
         src="https://images.unsplash.com/photo-1437622368342-7a3d73a34c8f?w=900"

    <p>兔子趕緊起身向終點跑去，但是已經太遲了。烏龜先抵達終點，贏得了比賽。</p>
    <p>森林裡的動物為烏龜歡呼。兔子終於明白，不能因為自己有優勢就驕傲自滿。</p>

    <h2>故事啟示</h2>
    <p>持續努力、保持謙虛、不輕易放棄，即使速度較慢，也有機會達成目標。</p>
